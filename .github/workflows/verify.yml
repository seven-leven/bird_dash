name: Verify

# Shared by ci.yml (pull requests) and deploy.yml (pushes to main) so both run
# exactly the same checks.
on:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload ./dist as the GitHub Pages artifact (deploy workflow only)
        type: boolean
        default: false

# Opt into Node.js 24 for all actions in this workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the app version derives patch from the commit count
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno install --allow-scripts

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check

      - name: Type check
        run: deno task typecheck

      # Every test tier (script/test/tiers.ts) plus the coverage floor from deno.jsonc.
      # The runner writes a per-tier table and the coverage table to the job summary,
      # annotates failures on the changed files, and keeps the JUnit file. Pinned to a
      # timezone west of UTC (the dev machine is UTC+5) so date code that accidentally
      # uses local time fails here instead of for some viewers; the other zones run
      # in `timezones` below.
      - name: Tests (all tiers) with coverage
        run: deno task test:coverage
        env:
          TZ: America/Los_Angeles

      - name: Keep test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Asset integrity
        run: deno task check

      - name: Build frontend
        run: deno task build:vite

      - name: Upload Pages artifact
        if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Date logic has bitten us before (a month bucketed wrongly for viewers west of
  # UTC), so repeat the unit tests across zones that straddle the date line and
  # use half-hour offsets. Runs in parallel with `verify`.
  timezones:
    name: Tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Kolkata, Pacific/Kiritimati]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno install --allow-scripts

      - name: Tests (all tiers)
        run: deno task test
        env:
          TZ: ${{ matrix.tz }}
