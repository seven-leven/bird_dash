name: CI

on:
  pull_request:
  workflow_dispatch:

# Read-only: these runs check code and never write to the repository. The token
# reaches verify.yml too, since a called workflow runs with its caller's permissions.
permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
