name: Nightly

# A slow, deep run that would be wasteful on every pull request: the property-based
# tests at 25x their normal number of generated inputs, in a few timezones. Random
# inputs mean a bug can hide from a shallow run; if this ever fails, the seed and the
# shrunk counterexample are in the log (and the job summary).
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

# Read-only: the deep run only checks code.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deep-properties:
    name: Deep property tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Los_Angeles, Pacific/Kiritimati]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Property tests at 25x depth
        run: node --run test:prop
        env:
          TZ: ${{ matrix.tz }}
          FC_RUNS_MULTIPLIER: '25'
