name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Opt into Node.js 24 for all actions in this workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Same checks as pull requests, then the built site becomes the Pages
  # artifact. Nothing deploys unless every check is green.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      upload-pages: true

  deploy:
    name: Deploy to Pages
    needs: verify
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v5
